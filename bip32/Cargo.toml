[package]
name = "bip32"
version = "0.1.0"
edition = "2021"
description = "BIP-32 key tools. Targets: bip32-decode (extended-key xpub/xprv decoder)."

# A vibetool can build many targets; add more [[bin]] entries as the toolset grows.
[[bin]]
name = "bip32-decode"
path = "src/main.rs"

[lib]
name = "bip32"
path = "src/lib.rs"

[dependencies]
base58 = { path = "../base58" }
ripemd160 = { path = "../ripemd160" }
secp256k1 = { path = "../secp256k1" }
sha512 = { path = "../sha512" }
