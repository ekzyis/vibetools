# Workspace for the Rust vibetools. Each vibetool is a crate in its own folder;
# a crate may expose modules, binary targets, or both, and may depend on other
# vibetools. They share one target/ and Cargo.lock. Add new crates as `members`.
[workspace]
resolver = "2"
members = ["sha256", "sha512", "ripemd160", "base58", "bech32", "secp256k1", "bip32", "descriptor"]
